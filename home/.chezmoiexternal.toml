# Third-party files chezmoi downloads and keeps up to date (re-checked weekly).

# Fuzzy tab-completion menu for zsh.
[".config/zsh/plugins/fzf-tab"]
  type = "git-repo"
  url = "https://github.com/Aloxaf/fzf-tab.git"
  refreshPeriod = "168h"

# Tokyo Night theme for bat (bat doesn't ship one).
[".config/bat/themes/tokyonight_night.tmTheme"]
  type = "file"
  url = "https://raw.githubusercontent.com/folke/tokyonight.nvim/main/extras/sublime/tokyonight_night.tmTheme"
  refreshPeriod = "168h"
