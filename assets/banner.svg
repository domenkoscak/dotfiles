<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="1200" height="330" role="img" aria-label="~/dotfiles: my macOS setup">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1b26"/>
      <stop offset="1" stop-color="#13141c"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="0.82" cy="0.15" r="0.55">
      <stop offset="0" stop-color="#7aa2f7" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#7aa2f7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPurple" cx="0.05" cy="1" r="0.6">
      <stop offset="0" stop-color="#bb9af7" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#bb9af7" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#414868" opacity="0.45"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="330" rx="24"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="330" fill="url(#bg)"/>
    <rect width="1200" height="330" fill="url(#dots)"/>
    <rect width="1200" height="330" fill="url(#glowBlue)"/>
    <rect width="1200" height="330" fill="url(#glowPurple)"/>
  </g>

  <!-- Title -->
  <text x="72" y="148" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="76" font-weight="700" fill="#c0caf5"><tspan fill="#7aa2f7">~/</tspan>dotfiles</text>
  <text x="74" y="200" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" fill="#a9b1d6">My macOS setup. Fresh Mac to home</text>
  <text x="74" y="234" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" fill="#a9b1d6">in one command.</text>

  <!-- Mini terminal -->
  <rect x="770" y="58" width="370" height="214" rx="14" fill="#16161e" stroke="#292e42" stroke-width="1.5"/>
  <circle cx="792" cy="80" r="6" fill="#ff5f57"/>
  <circle cx="812" cy="80" r="6" fill="#febc2e"/>
  <circle cx="832" cy="80" r="6" fill="#28c840"/>
  <g font-family="'SF Mono', Menlo, Consolas, monospace" font-size="15" xml:space="preserve">
    <text x="792" y="122"><tspan fill="#7dcfff" font-weight="700">❯</tspan><tspan fill="#c0caf5"> ~/dotfiles/install.sh</tspan></text>
    <text x="792" y="150"><tspan fill="#9ece6a">✓</tspan><tspan fill="#c0caf5"> Homebrew  </tspan><tspan fill="#565f89">apps · CLI · fonts</tspan></text>
    <text x="792" y="176"><tspan fill="#9ece6a">✓</tspan><tspan fill="#c0caf5"> dotfiles  </tspan><tspan fill="#565f89">zsh · git · ghostty</tspan></text>
    <text x="792" y="202"><tspan fill="#9ece6a">✓</tspan><tspan fill="#c0caf5"> mise      </tspan><tspan fill="#565f89">node · python</tspan></text>
    <text x="792" y="228"><tspan fill="#9ece6a">✓</tspan><tspan fill="#c0caf5"> macOS     </tspan><tspan fill="#565f89">dock · finder · keys</tspan></text>
    <text x="792" y="256" fill="#bb9af7">Welcome home, Lojze.</text>
  </g>
</svg>
